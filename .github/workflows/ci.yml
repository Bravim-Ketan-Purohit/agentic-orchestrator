name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy orchestrator/state orchestrator/stream orchestrator/worker orchestrator/events

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
        ports:
          - 7602:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@localhost:7602/orchestrator
          DATABASE_URL_SYNC: postgresql://orchestrator:orchestrator@localhost:7602/orchestrator
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@localhost:7602/orchestrator
          DATABASE_URL_SYNC: postgresql://orchestrator:orchestrator@localhost:7602/orchestrator
          TEST_DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@localhost:7602/orchestrator
          SQS_ENDPOINT_URL: http://localhost:7604
          SQS_QUEUE_URL: http://localhost:7604/000000000000/runs
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ $code -eq 5 ]; then echo "No tests collected yet - passing scaffold."; exit 0; fi
          exit $code

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Format check
        run: terraform -chdir=infra fmt -check

      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm install

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Typecheck SDK
        working-directory: sdk
        run: npm run typecheck
